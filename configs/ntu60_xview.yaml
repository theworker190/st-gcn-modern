output_dir: runs/ntu60_xview
device: auto
seed: 1
num_workers: 4

model:
  in_channels: 3
  num_class: 60
  dropout: 0.5
  edge_importance_weighting: true
  graph_args:
    layout: ntu-rgb+d
    strategy: spatial

dataset:
  train:
    data_path: data/ntu60/xview/train_data.npy
    label_path: data/ntu60/xview/train_label.pkl
  val:
    data_path: data/ntu60/xview/val_data.npy
    label_path: data/ntu60/xview/val_label.pkl

training:
  batch_size: 64
  batch_norm_shards: 4  # Upstream: batch 64 on four GPUs, 16 samples per replica.
  eval_batch_size: 64
  epochs: 80
  base_lr: 0.1
  steps: [10, 50]
  momentum: 0.9
  nesterov: true
  weight_decay: 0.0001
  log_interval: 100
  eval_interval: 5
  save_interval: 10
